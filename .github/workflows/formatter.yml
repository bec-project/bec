name: Ruff lint and format checks
on: [workflow_call]
jobs:
  Ruff:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install Ruff
        run: python -m pip install ruff==0.16.6
      - name: Check lint and imports
        run: ruff check --output-format=github .
      - name: Check formatting
        run: ruff format --check .
