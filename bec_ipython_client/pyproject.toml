[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bec_ipython_client"
version = "3.171.2"
description = "BEC IPython client"
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "bec-lib~=3.0",
    "ipython>=8.22,<10.0",
    "numpy>=1.24, <3.0",
    "pyepics~=3.5",
    "requests~=2.31",
    "rich>=13.7,<16.0",
]

[project.optional-dependencies]
dev = [
    "ruff==0.16.6",
    "coverage~=7.0",
    "pytest-bec-e2e~=3.0",
    "pytest-random-order~=1.1",
    "pytest-redis>=3.1,<6.0",
    "pytest-retry~=1.1",
    "pytest-timeout~=2.2",
    "pytest>=8,<10",
]

[project.scripts]
bec = "bec_ipython_client.main:main"

[project.urls]
"Bug Tracker" = "https://github.com/bec-project/bec/issues"
Homepage = "https://github.com/bec-project/bec"

[tool.hatch.build.targets.wheel]
include = ["*"]

[tool.ruff]
required-version = "==0.16.6"
line-length = 100
target-version = "py311"

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.format]
skip-magic-trailing-comma = true

[tool.ruff.lint.isort]
known-first-party = ["bec_lib", "bec_server", "bec_ipython_client"]
split-on-trailing-comma = false
